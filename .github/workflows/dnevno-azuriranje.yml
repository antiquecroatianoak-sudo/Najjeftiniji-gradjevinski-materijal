name: Dnevno ažuriranje cijena

on:
  schedule:
    - cron: "37 7 * * *"   # nakon što trgovci objave cjenike (najkasnije do 8:00 po hrvatskom vremenu)
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  azuriraj-i-objavi:
    # Objavljuje se samo glavna grana repozitorija.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.objava.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Provjeri aplikaciju i uvoz
        run: |
          python tests/uvoz.py
          python tests/otkrivanje.py
          node tests/skupine.cjs
          node tests/kosarica.cjs
          node tests/glasovni-unos.cjs

      # Zadnji valjani cjenik svakog izvora, za dan kad izvor ne radi (starost se provjerava pri uvozu).
      - uses: actions/cache/restore@v4
        with:
          path: .predmemorija
          key: cjenici-${{ github.run_id }}
          restore-keys: cjenici-

      - name: Otkrij nove javne cjenike
        # Greška otkrivanja ne zaustavlja uvoz već uključenih izvora.
        continue-on-error: true
        timeout-minutes: 40
        run: python scripts/otkrivanje.py

      - name: Preuzmi cjenike provjerenih izvora
        id: uvoz
        timeout-minutes: 20
        run: |
          python scripts/uvoz.py --otkriveni site/data/otkriveni.json
          if [ -f site/data/proizvodi.json ]; then echo "ima=da" >> "$GITHUB_OUTPUT"; else echo "::notice::Nema valjanih cjenika; objava je preskočena."; fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .predmemorija
          key: cjenici-${{ github.run_id }}

      - name: Pripremi skupine za novi cjenik
        if: steps.uvoz.outputs.ima == 'da'
        run: node scripts/razvrstaj.cjs

      - uses: actions/configure-pages@v5
        if: steps.uvoz.outputs.ima == 'da'

      - uses: actions/upload-pages-artifact@v3
        if: steps.uvoz.outputs.ima == 'da'
        with:
          path: site

      - name: Objavi aplikaciju
        if: steps.uvoz.outputs.ima == 'da'
        id: objava
        uses: actions/deploy-pages@v4

  # Na radnim granama: stvarno otkrivanje i uvoz za provjeru, bez objave. Rezultat je artefakt "provjera-izvora".
  provjera-izvora:
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Testovi
        run: |
          python tests/uvoz.py
          python tests/otkrivanje.py
      - name: Izbornik kategorija Njuškala (samo kategorije, bez oglasa)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/kategorije_njuskalo.py
      - name: Otkrij nove javne cjenike
        continue-on-error: true
        timeout-minutes: 40
        run: python scripts/otkrivanje.py
      - name: Uvezi provjerene izvore (bez objave)
        timeout-minutes: 20
        run: |
          python scripts/uvoz.py --otkriveni site/data/otkriveni.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          st = json.loads(Path("site/data/stanje-izvora.json").read_text())
          ok = [s for s in st["uvezeno"] if s["uspjeh"]]
          print(f"Uspješnih izvora: {len(ok)} od {len(st['uvezeno'])}")
          for s in st["uvezeno"]:
              print(("OK " if s["uspjeh"] else "-- ") + json.dumps({k: s.get(k) for k in ("naziv", "url", "datum", "primljeno", "prihvaceno", "nedostupno", "odbaceno", "greska")}, ensure_ascii=False))
          p = Path("site/data/proizvodi.json")
          if p.exists():
              d = json.loads(p.read_text())
              print(f"Ponuda: {len(d['proizvodi'])}, izvora: {len(d['lanci'])}, datum: {d['datum']}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provjera-izvora
          path: |
            site/data/stanje-izvora.json
            site/data/otkriveni.json
            site/data/njuskalo-kategorije.json
          if-no-files-found: ignore
